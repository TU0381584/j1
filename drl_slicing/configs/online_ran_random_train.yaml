name: online_ran_random_train
horizon_steps: 300
random_seed: 42

slices:
  - slice_id: "1-0"
    sst: 1
    sd: 0
    latency_budget_ms: 45
    loss_budget_pct: 2.0
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-1"
    sst: 1
    sd: 1
    latency_budget_ms: 15
    loss_budget_pct: 0.8
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-2"
    sst: 1
    sd: 2
    latency_budget_ms: 20
    loss_budget_pct: 1.0
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5

collector:
  mode: online_ran_random
  step_seconds: 0
  csv_path: ""
  prometheus_url: ""
  metric_queries: {}

controller:
  mode: dqn_train
  alpha: 0.2
  min_step: 2
  max_step: 5

output:
  policy_json_path: /home/w5/ors/ORANSlice/oai_ran/rrmPolicy.json
  run_log_csv: results/online_ran_random_train_log.csv
