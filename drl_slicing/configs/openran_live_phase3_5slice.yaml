name: openran_live_phase3_5slice
horizon_steps: 300
random_seed: 42

slices:
  - slice_id: "1-0"
    sst: 1
    sd: 0
    latency_budget_ms: 45
    loss_budget_pct: 2.0
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-1"
    sst: 1
    sd: 1
    latency_budget_ms: 14
    loss_budget_pct: 0.7
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-2"
    sst: 1
    sd: 2
    latency_budget_ms: 20
    loss_budget_pct: 1.0
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-3"
    sst: 1
    sd: 3
    latency_budget_ms: 30
    loss_budget_pct: 1.3
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-4"
    sst: 1
    sd: 4
    latency_budget_ms: 18
    loss_budget_pct: 0.9
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5

collector:
  mode: prometheus
  step_seconds: 1
  csv_path: ""
  prometheus_url: "http://127.0.0.1:9090"
  metric_queries:
    throughput_kbps: '(label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.28 + 0.10*abs(sin(vector(time()/17))))), "slice_id", "1-0", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.17 + 0.08*abs(sin(vector((time()+5)/9))))), "slice_id", "1-1", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.22 + 0.09*abs(sin(vector((time()+11)/11))))), "slice_id", "1-2", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.18 + 0.08*abs(sin(vector((time()+17)/13))))), "slice_id", "1-3", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.15 + 0.07*abs(sin(vector((time()+23)/15))))), "slice_id", "1-4", "__name__", ".*"))'
    offered_load_kbps: '(label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.42 + 0.16*abs(sin(vector(time()/19))))), "slice_id", "1-0", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.24 + 0.12*abs(sin(vector((time()+7)/9))))), "slice_id", "1-1", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.30 + 0.12*abs(sin(vector((time()+13)/11))))), "slice_id", "1-2", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.26 + 0.10*abs(sin(vector((time()+19)/13))))), "slice_id", "1-3", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.22 + 0.10*abs(sin(vector((time()+29)/15))))), "slice_id", "1-4", "__name__", ".*"))'
    latency_ms: '(label_replace((20 + 14*abs(sin(vector(time()/19))) + 4*abs(sin(vector((time()+7)/5)))), "slice_id", "1-0", "__name__", ".*") or label_replace((8 + 10*abs(sin(vector((time()+1)/6))) + 4*abs(sin(vector((time()+13)/3)))), "slice_id", "1-1", "__name__", ".*") or label_replace((11 + 12*abs(sin(vector((time()+17)/12))) + 4*abs(sin(vector((time()+29)/6)))), "slice_id", "1-2", "__name__", ".*") or label_replace((14 + 10*abs(sin(vector((time()+23)/11))) + 3*abs(sin(vector((time()+31)/7)))), "slice_id", "1-3", "__name__", ".*") or label_replace((10 + 9*abs(sin(vector((time()+37)/10))) + 4*abs(sin(vector((time()+41)/5)))), "slice_id", "1-4", "__name__", ".*"))'
    loss_pct: '(label_replace((0.20 + 1.0*abs(sin(vector(time()/23))) + 0.2*abs(sin(vector((time()+7)/4)))), "slice_id", "1-0", "__name__", ".*") or label_replace((0.05 + 0.9*abs(sin(vector((time()+1)/7))) + 0.2*abs(sin(vector((time()+11)/3)))), "slice_id", "1-1", "__name__", ".*") or label_replace((0.10 + 0.9*abs(sin(vector((time()+19)/14))) + 0.2*abs(sin(vector((time()+29)/5)))), "slice_id", "1-2", "__name__", ".*") or label_replace((0.14 + 0.7*abs(sin(vector((time()+23)/12))) + 0.2*abs(sin(vector((time()+31)/6)))), "slice_id", "1-3", "__name__", ".*") or label_replace((0.08 + 0.8*abs(sin(vector((time()+37)/11))) + 0.2*abs(sin(vector((time()+41)/4)))), "slice_id", "1-4", "__name__", ".*"))'

controller:
  mode: dqn_train
  alpha: 0.2
  min_step: 2
  max_step: 5

output:
  policy_json_path: /home/w5/ors/ORANSlice/oai_ran/rrmPolicy.json
  run_log_csv: results/phase3/live_configs/openran_live_phase3_5slice_log.csv
