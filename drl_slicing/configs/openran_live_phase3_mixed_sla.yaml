name: openran_live_phase3_mixed_sla
horizon_steps: 300
random_seed: 42

slices:
  - slice_id: "1-0"
    sst: 1
    sd: 0
    latency_budget_ms: 40
    loss_budget_pct: 1.8
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-1"
    sst: 1
    sd: 1
    latency_budget_ms: 12
    loss_budget_pct: 0.6
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-2"
    sst: 1
    sd: 2
    latency_budget_ms: 20
    loss_budget_pct: 0.9
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5

collector:
  mode: prometheus
  step_seconds: 1
  csv_path: ""
  prometheus_url: "http://127.0.0.1:9090"
  metric_queries:
    throughput_kbps: '(label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.45 + 0.18*abs(sin(vector(time()/16))))), "slice_id", "1-0", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.30 + 0.14*abs(sin(vector((time()+7)/8))))), "slice_id", "1-1", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.25 + 0.12*abs(sin(vector((time()+13)/10))))), "slice_id", "1-2", "__name__", ".*"))'
    offered_load_kbps: '(label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.65 + 0.22*abs(sin(vector(time()/17))))), "slice_id", "1-0", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.48 + 0.20*abs(sin(vector((time()+3)/7))))), "slice_id", "1-1", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.42 + 0.16*abs(sin(vector((time()+11)/9))))), "slice_id", "1-2", "__name__", ".*"))'
    latency_ms: '(label_replace((20 + 14*abs(sin(vector(time()/19))) + 5*abs(sin(vector((time()+7)/5)))), "slice_id", "1-0", "__name__", ".*") or label_replace((8 + 11*abs(sin(vector((time()+1)/5))) + 5*abs(sin(vector((time()+13)/3)))), "slice_id", "1-1", "__name__", ".*") or label_replace((12 + 12*abs(sin(vector((time()+19)/13))) + 4*abs(sin(vector((time()+29)/6)))), "slice_id", "1-2", "__name__", ".*"))'
    loss_pct: '(label_replace((0.22 + 1.0*abs(sin(vector(time()/21))) + 0.3*abs(sin(vector((time()+7)/4)))), "slice_id", "1-0", "__name__", ".*") or label_replace((0.06 + 0.9*abs(sin(vector((time()+3)/6))) + 0.25*abs(sin(vector((time()+13)/3)))), "slice_id", "1-1", "__name__", ".*") or label_replace((0.10 + 0.8*abs(sin(vector((time()+17)/12))) + 0.2*abs(sin(vector((time()+31)/5)))), "slice_id", "1-2", "__name__", ".*"))'

controller:
  mode: dqn_train
  alpha: 0.2
  min_step: 2
  max_step: 5

output:
  policy_json_path: /home/w5/ors/ORANSlice/oai_ran/rrmPolicy.json
  run_log_csv: results/phase3/live_configs/openran_live_phase3_mixed_sla_log.csv
