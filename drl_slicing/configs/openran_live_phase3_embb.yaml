name: openran_live_phase3_embb
horizon_steps: 300
random_seed: 42

slices:
  - slice_id: "1-0"
    sst: 1
    sd: 0
    latency_budget_ms: 55
    loss_budget_pct: 3.0
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-1"
    sst: 1
    sd: 1
    latency_budget_ms: 18
    loss_budget_pct: 1.0
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5
  - slice_id: "1-2"
    sst: 1
    sd: 2
    latency_budget_ms: 25
    loss_budget_pct: 1.5
    min_ratio_bounds: [5, 60]
    max_ratio_bounds: [40, 100]
    dedicated_ratio: 5

collector:
  mode: prometheus
  step_seconds: 1
  csv_path: ""
  prometheus_url: "http://127.0.0.1:9090"
  metric_queries:
    throughput_kbps: '(label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.78 + 0.15*abs(sin(vector(time()/17))))), "slice_id", "1-0", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.12 + 0.08*abs(sin(vector((time()+7)/9))))), "slice_id", "1-1", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_indatapktn3upf[30s]), 0.01) * 12 * (0.10 + 0.06*abs(sin(vector((time()+13)/11))))), "slice_id", "1-2", "__name__", ".*"))'
    offered_load_kbps: '(label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.96 + 0.30*abs(sin(vector(time()/19))))), "slice_id", "1-0", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.18 + 0.10*abs(sin(vector((time()+5)/8))))), "slice_id", "1-1", "__name__", ".*") or label_replace((clamp_min(rate(fivegs_ep_n3_gtp_outdatapktn3upf[30s]), 0.01) * 12 * (0.16 + 0.08*abs(sin(vector((time()+15)/12))))), "slice_id", "1-2", "__name__", ".*"))'
    latency_ms: '(label_replace((24 + 15*abs(sin(vector(time()/20))) + 4*abs(sin(vector((time()+8)/5)))), "slice_id", "1-0", "__name__", ".*") or label_replace((7 + 8*abs(sin(vector((time()+3)/6))) + 4*abs(sin(vector((time()+11)/3)))), "slice_id", "1-1", "__name__", ".*") or label_replace((12 + 10*abs(sin(vector((time()+17)/14))) + 5*abs(sin(vector((time()+29)/6)))), "slice_id", "1-2", "__name__", ".*"))'
    loss_pct: '(label_replace((0.20 + 0.8*abs(sin(vector(time()/23))) + 0.2*abs(sin(vector((time()+7)/4)))), "slice_id", "1-0", "__name__", ".*") or label_replace((0.05 + 0.7*abs(sin(vector((time()+1)/7))) + 0.2*abs(sin(vector((time()+11)/3)))), "slice_id", "1-1", "__name__", ".*") or label_replace((0.10 + 0.9*abs(sin(vector((time()+19)/14))) + 0.3*abs(sin(vector((time()+31)/5)))), "slice_id", "1-2", "__name__", ".*"))'

controller:
  mode: dqn_train
  alpha: 0.2
  min_step: 2
  max_step: 5

output:
  policy_json_path: /home/w5/ors/ORANSlice/oai_ran/rrmPolicy.json
  run_log_csv: results/phase3/live_configs/openran_live_phase3_embb_log.csv
