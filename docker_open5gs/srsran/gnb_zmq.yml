amf:
  addr: AMF_IP
  bind_addr: SRS_GNB_IP

ru_sdr:
  device_driver: zmq
  device_args: tx_port=tcp://SRS_GNB_IP:2000,rx_port=tcp://SRS_UE_IP:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 75
  rx_gain: 75

cell_cfg:
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "PLMN"
  tac: 1
  pci: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 13
  prach:
    prach_config_index: 1

log:
  filename: /mnt/srsran/gnb.log
  all_level: warning

pcap:
  mac_enable: false
  mac_filename: /mnt/srsran/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /mnt/srsran/gnb_ngap.pcap
  f1ap_enable: false
  f1ap_filename: /mnt/srsran/gnb_f1ap.pcap
  e1ap_enable: false
  e1ap_filename: /mnt/srsran/gnb_e1ap.pcap
  e2ap_enable: false
  e2ap_filename: /mnt/srsran/gnb_e2ap.pcap
  n3_enable: false
  n3_filename: /mnt/srsran/gnb_n3.pcap
