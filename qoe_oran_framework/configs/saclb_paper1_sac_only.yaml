# Paper #1 (MECON) comparator: single gNB, URLLC+eMBB only, no LB term.
name: saclb_paper1_sac_only
random_seed: 256
paper_variant: paper1
B: 100
Lmax: 100

gnbs:
  - gnb_id: gnb-0
    prb_capacity: 100

slices:
  - slice_id: urllc
    sst: 1
    sd: 1
    nominal_ratio: 30
    min_ratio_floor: 5
    max_ratio_cap: 60
    latency_budget_ms: 15
    loss_budget_pct: 0.8
    priority_weight: 4.0
    accept_reward: 1.0
    violation_penalty: 2.0
  - slice_id: embb
    sst: 1
    sd: 0
    nominal_ratio: 70
    min_ratio_floor: 10
    max_ratio_cap: 90
    latency_budget_ms: 45
    loss_budget_pct: 2.0
    priority_weight: 2.0
    accept_reward: 1.0
    violation_penalty: 1.0

reward:
  congestion_coeff: 1.0
  lb_coeff: 0.0

arrivals:
  synthetic_arrivals_per_step: 2
  max_pending_per_step: 8
  ceiling_step_ratio: 5

episode:
  step_seconds: 5.0
  steps_per_episode: 60
